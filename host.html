
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="host.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>

</head>

<body>

  <div class="login-card">
    <div class="avatar">👤</div>

    <h1>Welcome Back!</h1>
    <p class="subtitle">Please login to your account</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-box">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="togglePassword"
            aria-label="Show password"
          >Show</button>
        </div>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="remember">
          Remember me
        </label>

        <a href="#" id="forgotLink">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn">
        Login →
      </button>

      <p class="message" id="message" role="status"></p>
    </form>

    <p class="signup">
      Don't have an account?
      <a href="#" id="signupLink">Sign up</a>
    </p>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const toggle = document.getElementById("togglePassword");
    const message = document.getElementById("message");

    toggle.addEventListener("click", function () {
      const isHidden = password.type === "password";

      password.type = isHidden ? "text" : "password";
      toggle.textContent = isHidden ? "Hide" : "Show";
      toggle.setAttribute(
        "aria-label",
        isHidden ? "Hide password" : "Show password"
      );
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      message.style.color = "#d12d42";
      message.textContent =
        "Demo only: connect a secure authentication system to log in.";
    });

    document.getElementById("forgotLink").addEventListener(
      "click", function (event) {
        event.preventDefault();
        message.style.color = "#1677ff";
        message.textContent =
          "Connect this link to your password recovery page.";
      }
    );

    document.getElementById("signupLink").addEventListener(
      "click", function (event) {
        event.preventDefault();
        message.style.color = "#1677ff";
        message.textContent =
          "Connect this link to your registration page.";
      }
    );
  </script>

</body>
</html>
